<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agenda Docente Profesional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@300;400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, onSnapshot, query, where, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKFxQG7buVaP47ghdUiXLbCjTfk3i1TVA",
  authDomain: "agenda-docente-cfcb3.firebaseapp.com",
  databaseURL: "https://agenda-docente-cfcb3-default-rtdb.firebaseio.com",
  projectId: "agenda-docente-cfcb3",
  storageBucket: "agenda-docente-cfcb3.firebasestorage.app",
  messagingSenderId: "877985632064",
  appId: "1:877985632064:web:3c68ecdc4245c609ac34a5",
  measurementId: "G-30Y76GNM68"
};

// Inicializar Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// ============================================================
// 🌍 ESTADO GLOBAL
// ============================================================
const state = {
  user: null,
  currentSection: 'dashboard',
  settings: {
    primaryColor: '#4F46E5',
    secondaryColor: '#10B981',
    accentColor: '#F59E0B',
    fontFamily: 'Inter',
    theme: 'light',
    background: '',
    googleCalendarConnected: false
  },
  institutions: [],
  activeInstitution: null,
  subjects: [],
  students: [],
  events: [],
  logs: [],
  familyContacts: [],
  unsubscribers: []
};

// Exponer estado globalmente
window.appState = state;
window.firebaseApp = { auth, db, provider };

// ============================================================
// 🔐 AUTENTICACIÓN
// ============================================================
window.loginWithGoogle = async () => {
  try {
    const result = await signInWithPopup(auth, provider);
    state.user = result.user;
    await loadUserData();
    showApp();
  } catch (error) {
    console.error('Error de autenticación:', error);
    showNotification('Error al iniciar sesión: ' + error.message, 'error');
  }
};

window.logout = async () => {
  try {
    state.unsubscribers.forEach(unsub => unsub());
    state.unsubscribers = [];
    await signOut(auth);
    state.user = null;
    showLogin();
  } catch (error) {
    console.error('Error al cerrar sesión:', error);
  }
};

// Escuchar cambios de autenticación
onAuthStateChanged(auth, async (user) => {
  if (user) {
    state.user = user;
    await loadUserData();
    showApp();
  } else {
    showLogin();
  }
});

// ============================================================
// 💾 CARGA Y GUARDADO DE DATOS
// ============================================================
async function loadUserData() {
  if (!state.user) return;
  const userId = state.user.uid;
  
  // Cargar settings
  const settingsSnap = await getDoc(doc(db, `users/${userId}/settings/main`));
  if (settingsSnap.exists()) {
    state.settings = { ...state.settings, ...settingsSnap.data() };
  } else {
    await setDoc(doc(db, `users/${userId}/settings/main`), state.settings);
  }
  
  // Cargar perfil
  const profileSnap = await getDoc(doc(db, `users/${userId}/profile/main`));
  if (!profileSnap.exists()) {
    await setDoc(doc(db, `users/${userId}/profile/main`), {
      name: state.user.displayName || '',
      email: state.user.email || '',
      photo: state.user.photoURL || '',
      createdAt: serverTimestamp()
    });
  }
  
  // Suscripciones en tiempo real
  subscribeToInstitutions();
  subscribeToEvents();
  subscribeToLogs();
  
  applySettings();
}

function subscribeToInstitutions() {
  const q = collection(db, `users/${state.user.uid}/institutions`);
  const unsub = onSnapshot(q, (snapshot) => {
    state.institutions = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.institutions.length > 0 && !state.activeInstitution) {
      state.activeInstitution = state.institutions[0].id;
    }
    renderActiveSection();
  });
  state.unsubscribers.push(unsub);
}

function subscribeToEvents() {
  const q = collection(db, `users/${state.user.uid}/events`);
  const unsub = onSnapshot(q, (snapshot) => {
    state.events = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderActiveSection();
  });
  state.unsubscribers.push(unsub);
}

function subscribeToLogs() {
  const q = collection(db, `users/${state.user.uid}/logs`);
  const unsub = onSnapshot(q, (snapshot) => {
    state.logs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  });
  state.unsubscribers.push(unsub);
}

window.saveData = async (collectionPath, data, id = null) => {
  if (!state.user) return;
  const path = `users/${state.user.uid}/${collectionPath}`;
  try {
    if (id) {
      await setDoc(doc(db, path, id), data, { merge: true });
    } else {
      await addDoc(collection(db, path), { ...data, createdAt: serverTimestamp() });
    }
    showNotification('Guardado correctamente', 'success');
  } catch (error) {
    console.error('Error al guardar:', error);
    showNotification('Error al guardar: ' + error.message, 'error');
  }
};

window.deleteData = async (collectionPath, id) => {
  if (!state.user) return;
  try {
    await deleteDoc(doc(db, `users/${state.user.uid}/${collectionPath}`, id));
    showNotification('Eliminado correctamente', 'success');
  } catch (error) {
    console.error('Error al eliminar:', error);
    showNotification('Error al eliminar: ' + error.message, 'error');
  }
};

// ============================================================
// 🎨 UI Y NAVEGACIÓN
// ============================================================
function showLogin() {
  document.getElementById('loginScreen').classList.add('active');
  document.getElementById('appScreen').classList.remove('active');
}

function showApp() {
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('appScreen').classList.add('active');
  updateUserUI();
  renderActiveSection();
}

function updateUserUI() {
  const userName = document.getElementById('userName');
  const userEmail = document.getElementById('userEmail');
  const userPhoto = document.getElementById('userPhoto');
  if (userName) userName.textContent = state.user?.displayName || 'Docente';
  if (userEmail) userEmail.textContent = state.user?.email || '';
  if (userPhoto && state.user?.photoURL) userPhoto.src = state.user.photoURL;
}

window.navigateTo = (section) => {
  state.currentSection = section;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navItem = document.querySelector(`[data-section="${section}"]`);
  if (navItem) navItem.classList.add('active');
  renderActiveSection();
  if (window.innerWidth < 1024) {
    document.getElementById('sidebar').classList.remove('open');
  }
};

function renderActiveSection() {
  const content = document.getElementById('mainContent');
  const renderers = {
    'dashboard': renderDashboard,
    'institutions': renderInstitutions,
    'subjects': renderSubjects,
    'calendar': renderCalendar,
    'students': renderStudents,
    'classes': renderClasses,
    'planning': renderPlanning,
    'subjectDetails': renderSubjectDetails,
    'evaluation': renderEvaluation,
    'families': renderFamilies,
    'staff': renderStaff,
    'wellness': renderWellness,
    'training': renderTraining,
    'settings': renderSettings
  };
  const renderer = renderers[state.currentSection] || renderDashboard;
  content.innerHTML = renderer();
  lucide.createIcons();
  if (typeof window.attachSectionHandlers === 'function') {
    window.attachSectionHandlers();
  }
}

// ============================================================
// 🎨 RENDERIZADO DE SECCIONES
// ============================================================
function renderDashboard() {
  const today = new Date();
  const todayEvents = state.events.filter(e => {
    if (!e.date) return false;
    const eventDate = new Date(e.date);
    return eventDate.toDateString() === today.toDateString();
  });
  
  const upcomingEvents = state.events
    .filter(e => e.date && new Date(e.date) >= today)
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .slice(0, 5);
  
  const totalStudents = state.institutions.reduce((sum, inst) => sum + (inst.studentCount || 0), 0);
  
  return `
    <div class="section-header">
      <div>
        <h1>¡Buen día, ${state.user?.displayName?.split(' ')[0] || 'docente'}! 👋</h1>
        <p class="subtitle">${today.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
      </div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background: var(--primary-light); color: var(--primary);">
          <i data-lucide="building-2"></i>
        </div>
        <div class="stat-info">
          <span class="stat-value">${state.institutions.length}</span>
          <span class="stat-label">Instituciones</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background: var(--secondary-light); color: var(--secondary);">
          <i data-lucide="book-open"></i>
        </div>
        <div class="stat-info">
          <span class="stat-value">${state.institutions.reduce((sum, i) => sum + (i.subjectCount || 0), 0)}</span>
          <span class="stat-label">Materias</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background: var(--accent-light); color: var(--accent);">
          <i data-lucide="users"></i>
        </div>
        <div class="stat-info">
          <span class="stat-value">${totalStudents}</span>
          <span class="stat-label">Alumnos</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background: #FEE2E2; color: #DC2626;">
          <i data-lucide="calendar"></i>
        </div>
        <div class="stat-info">
          <span class="stat-value">${state.events.length}</span>
          <span class="stat-label">Eventos</span>
        </div>
      </div>
    </div>
    
    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header">
          <h3><i data-lucide="calendar-days"></i> Próximos eventos</h3>
        </div>
        <div class="card-body">
          ${upcomingEvents.length === 0 ? `
            <div class="empty-state">
              <i data-lucide="calendar-x"></i>
              <p>Sin eventos próximos</p>
              <button class="btn btn-primary btn-sm" onclick="navigateTo('calendar')">Crear evento</button>
            </div>
          ` : upcomingEvents.map(e => `
            <div class="event-item" style="border-left: 3px solid ${e.color || 'var(--primary)'};">
              <div class="event-date">${new Date(e.date).toLocaleDateString('es-ES', {day:'2-digit', month:'short'})}</div>
              <div class="event-info">
                <strong>${e.title}</strong>
                <span>${e.type || 'Evento'}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      
      <div class="card">
        <div class="card-header">
          <h3><i data-lucide="zap"></i> Accesos rápidos</h3>
        </div>
        <div class="card-body">
          <div class="quick-actions">
            <button class="quick-action" onclick="navigateTo('institutions')">
              <i data-lucide="building-2"></i>
              <span>Nueva institución</span>
            </button>
            <button class="quick-action" onclick="navigateTo('subjects')">
              <i data-lucide="book-open"></i>
              <span>Nueva materia</span>
            </button>
            <button class="quick-action" onclick="navigateTo('students')">
              <i data-lucide="user-plus"></i>
              <span>Nuevo alumno</span>
            </button>
            <button class="quick-action" onclick="navigateTo('calendar')">
              <i data-lucide="calendar-plus"></i>
              <span>Nuevo evento</span>
            </button>
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="card-header">
          <h3><i data-lucide="book-marked"></i> Clases de hoy</h3>
        </div>
        <div class="card-body">
          ${todayEvents.filter(e => e.type === 'Clase').length === 0 ? `
            <div class="empty-state">
              <i data-lucide="clock"></i>
              <p>Configura tu horario en Instituciones</p>
            </div>
          ` : todayEvents.filter(e => e.type === 'Clase').map(e => `
            <div class="class-item" style="background: ${e.color || 'var(--primary-light)'}20;">
              <strong>${e.title}</strong>
              <span>${e.time || ''}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

      </button>
    </div>
    
    <div class="calendar-tabs">
      <button class="tab-btn active" onclick="switchCalendarView('month', this)">Mensual</button>
      <button class="tab-btn" onclick="switchCalendarView('year', this)">Anual</button>
      <button class="tab-btn" onclick="switchCalendarView('week', this)">Semanal</button>

    <div id="calendarView">

            <div class="form-group">

            </div>
            <div class="form-group">
              <label>Hora</label>
              <input type="time" id="evt_time" />
            </div>

function renderMonthView(year, month) {
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const daysInMonth = lastDay.getDate();
  const startDay = firstDay.getDay();
  
  const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  
  let days = '';
  for (let i = 0; i < startDay; i++) {
    days += '<div class="calendar-day empty"></div>';
  }
  
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayEvents = state.events.filter(e => e.date === dateStr);
    
    days += `
      <div class="calendar-day" onclick="openEventModal('${dateStr}')">
        <div class="day-number">${day}</div>
        <div class="day-events">
          ${dayEvents.slice(0, 3).map(e => `
            <div class="day-event" style="background: ${e.color || 'var(--primary)'};">
              ${e.title}
            </div>
          `).join('')}
          ${dayEvents.length > 3 ? `<div class="day-event more">+${dayEvents.length - 3} más</div>` : ''}
        </div>
      </div>
    `;
  }
  
  return `
    <div class="month-view">
      <div class="month-header">
        <button class="icon-btn" onclick="changeMonth(-1)">
          <i data-lucide="chevron-left"></i>
        </button>
        <h2>${monthNames[month]} ${year}</h2>
        <button class="icon-btn" onclick="changeMonth(1)">
          <i data-lucide="chevron-right"></i>
        </button>
      </div>
      <div class="calendar-weekdays">
        <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
      </div>
      <div class="calendar-grid">
        ${days}
      </div>
    </div>
  `;
}

window.saveSubject = async (e) => {
  e.preventDefault();
  const instId = state.activeInstitution;
  if (!instId) {
    showNotification('Selecciona una institución primero', 'error');
    return;
  }
  
  const inst = state.institutions.find(i => i.id === instId);
  const subjects = inst.subjects || [];
  const subId = document.getElementById('sub_id').value;
  
  const subjectData = {
    id: subId || `sub_${Date.now()}`,
    name: document.getElementById('sub_name').value,
    group: document.getElementById('sub_group').value,
    classroom: document.getElementById('sub_classroom').value,
    color: document.getElementById('sub_color').value,
    description: document.getElementById('sub_description').value,
    studentCount: 0
  };
  
  let updatedSubjects;
  if (subId) {
    updatedSubjects = subjects.map(s => s.id === subId ? { ...s, ...subjectData } : s);
  } else {
    updatedSubjects = [...subjects, subjectData];
  }
  
  await saveData('institutions', { 
    subjects: updatedSubjects, 
    subjectCount: updatedSubjects.length,
    updatedAt: serverTimestamp() 
  }, instId);
  
  closeModal('subjectModal');
};

window.deleteSubject = async (id) => {
  if (!confirm('¿Eliminar esta materia?')) return;
  const instId = state.activeInstitution;
  const inst = state.institutions.find(i => i.id === instId);
  const updatedSubjects = (inst.subjects || []).filter(s => s.id !== id);
  await saveData('institutions', { 
    subjects: updatedSubjects, 
    subjectCount: updatedSubjects.length,
    updatedAt: serverTimestamp() 
  }, instId);
};

    students: state.students,
    events: state.events,
    settings: state.settings,
    exportDate: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `agenda-docente-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showNotification('Datos exportados', 'success');
};

  const reader = new FileReader();
  reader.onload = async (e) => {

      const data = JSON.parse(e.target.result);
      showNotification('Importación en desarrollo', 'info');
    } catch (err) {
      showNotification('Error al importar: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
};

window.showNotification = (message, type = 'info') => {
  const existing = document.querySelector('.notification');
  if (existing) existing.remove();
  
  const notification = document.createElement('div');
  notification.className = `notification ${type}`;
  notification.innerHTML = `
    <i data-lucide="${type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info'}"></i>
    <span>${message}</span>
  `;
  document.body.appendChild(notification);
  lucide.createIcons();
  
  setTimeout(() => notification.classList.add('show'), 10);
  setTimeout(() => {
    notification.classList.remove('show');
    setTimeout(() => notification.remove(), 300);
  }, 3000);
};

}
